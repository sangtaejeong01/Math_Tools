<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시 암송 — 서시 · 윤동주</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 14px 40px;
    font-family: "Pretendard", "맑은 고딕", "Malgun Gothic", sans-serif;
    background: #eeecf7; color: #241f33;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0 0 16px; color: #7a7290; font-size: 14px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    padding: 10px 18px; border-radius: 999px; border: 2px solid #cdc6e3;
    background: #fff; color: #7a7290;
  }
  .tab.on { background: #4a3f7a; border-color: #4a3f7a; color: #fff; }

  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .stat {
    background: #fff; border: 1px solid #ddd7ee; border-radius: 10px;
    padding: 8px 14px; font-size: 15px; font-weight: 700;
  }
  .stat span { color: #4a3f7a; }
  .stat.wrongstat span { color: #c0392b; }

  .steps { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .step {
    flex: 1 1 130px; text-align: center; font-size: 13px; font-weight: 700;
    padding: 9px 6px; border-radius: 9px; background: #e2ddf1;
    color: #8b83a5; border: 2px solid transparent; cursor: pointer;
    font-family: inherit;
  }
  .step.on { background: #4a3f7a; color: #fff; border-color: #4a3f7a; }
  .step.done { background: #ddf0e2; color: #237a44; }

  .progress { height: 10px; background: #ddd7ee; border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .progress div { height: 100%; width: 0; background: #4a3f7a; transition: width .25s; }

  .sheet {
    background: linear-gradient(180deg, #ffffff 0%, #f7f5fd 100%);
    border: 1px solid #ddd7ee; border-radius: 14px;
    box-shadow: 0 6px 20px rgba(60,50,105,.12);
    padding: 30px 26px 26px;
  }
  .ptitle { text-align: center; font-size: 27px; font-weight: 800; color: #4a3f7a; letter-spacing: 6px; }
  .pauthor { text-align: center; font-size: 15px; color: #7a7290; margin: 10px 0 26px; }

  .stanza { margin: 0 0 22px; }
  .line { margin: 0 0 6px; line-height: 2.3; }
  .w { font-size: 20px; font-weight: 500; margin-right: 8px; vertical-align: middle; white-space: nowrap; }

  .note {
    margin-top: 18px; padding-top: 12px; border-top: 1px solid #ddd7ee;
    font-size: 13px; color: #8b83a5;
  }
  .note b { color: #e8562f; }

  input.b {
    font-family: inherit; font-size: 19px; font-weight: 700; text-align: center;
    padding: 3px 4px; margin-right: 8px; vertical-align: middle;
    border: 0; border-bottom: 3px solid #b0a6cd; background: rgba(255,255,255,.7);
    border-radius: 6px 6px 0 0; outline: none; color: #241f33;
  }
  input.b:focus { border-bottom-color: #4a3f7a; background: #fff; box-shadow: 0 0 0 3px rgba(74,63,122,.12); }
  input.b.ok { background: #ddf0e2; border-bottom-color: #2e9e5b; color: #1c6b3c; }
  input.b.no { background: #fde3e0; border-bottom-color: #c0392b; color: #a3271b; }
  input.b.shown { background: #fff3d6; border-bottom-color: #d9a441; color: #8a6415; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  button.act {
    font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    padding: 10px 18px; border-radius: 10px; border: 2px solid #4a3f7a;
    background: #4a3f7a; color: #fff;
  }
  button.act.ghost { background: #fff; color: #4a3f7a; }
  button.act.warn { background: #fff; color: #b4693a; border-color: #d9a441; }

  /* 받아쓰기 모드 */
  .trow { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 9px; }
  .tno { flex: 0 0 30px; font-size: 13px; font-weight: 700; color: #a79ec2; padding-top: 12px; text-align: right; }
  .tin {
    flex: 1 1 auto; font-family: inherit; font-size: 18px; padding: 9px 12px;
    border: 2px solid #ddd7ee; border-radius: 9px; background: #fff; color: #241f33; outline: none;
  }
  .tin:focus { border-color: #4a3f7a; box-shadow: 0 0 0 3px rgba(74,63,122,.1); }
  .tin.ok { border-color: #2e9e5b; background: #f2fbf5; }
  .tin.no { border-color: #c0392b; background: #fef6f5; }
  .thint { flex: 0 0 auto; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    padding: 9px 10px; border-radius: 8px; border: 2px solid #cdc6e3; background: #fff; color: #7a7290; }
  .tgap { height: 14px; }
  .fb { margin: 2px 0 4px 40px; font-size: 16px; line-height: 1.9; }
  .fb i { font-style: normal; margin-right: 7px; }
  .fb i.g { color: #237a44; }
  .fb i.r { color: #c0392b; text-decoration: line-through; }
  .fb i.a { color: #4a3f7a; font-weight: 700; }
  .fb i.m { color: #b4693a; font-weight: 700; }

  .done-msg { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: #ddf0e2;
    color: #1c6b3c; font-weight: 700; font-size: 16px; display: none; }
  .hide { display: none; }

  footer { margin: 26px auto 0; max-width: 820px; text-align: right; font-size: 12px; color: #a49bbb; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>시 암송 — 「서시」 윤동주</h1>
    <p>빈칸을 단계별로 늘려 가며 외우고, 마지막에 전체를 받아써서 확인합니다.</p>
  </header>

  <div class="tabs">
    <button class="tab on" id="tabA" type="button">빈칸 채우기</button>
    <button class="tab" id="tabB" type="button">받아쓰기 확인</button>
  </div>

  <!-- ============ 빈칸 채우기 ============ -->
  <section id="modeA">
    <div class="steps" id="steps"></div>
    <div class="bar">
      <div class="stat">맞힌 칸 <span id="okCount">0</span> / <span id="allCount">0</span></div>
      <div class="stat wrongstat">틀린 칸 <span id="noCount">0</span></div>
    </div>
    <div class="progress"><div id="barA"></div></div>

    <div class="sheet">
      <div class="ptitle">서시</div>
      <div class="pauthor">윤동주</div>
      <div id="poemA"></div>
      <div class="note"><b>◆ 스치운다</b> : ‘스친다’가 바른 표기임.</div>
    </div>

    <div class="done-msg" id="doneA"></div>

    <div class="btns">
      <button class="act" type="button" id="btnCheck">채점하기</button>
      <button class="act ghost" type="button" id="btnReset">다시 하기</button>
      <button class="act warn" type="button" id="btnPeek">정답 잠깐 보기</button>
      <button class="act ghost" type="button" id="btnShuffle">빈칸 다시 뽑기</button>
    </div>
  </section>

  <!-- ============ 받아쓰기 확인 ============ -->
  <section id="modeB" class="hide">
    <div class="bar">
      <div class="stat">맞은 줄 <span id="okLine">0</span> / <span id="allLine">0</span></div>
      <div class="stat wrongstat">틀린 줄 <span id="noLine">0</span></div>
    </div>
    <div class="progress"><div id="barB"></div></div>

    <div class="sheet">
      <div class="ptitle">서시</div>
      <div class="pauthor">윤동주</div>
      <div id="poemB"></div>
      <div class="note"><b>◆ 스치운다</b> : ‘스친다’가 바른 표기임.</div>
    </div>

    <div class="done-msg" id="doneB"></div>

    <div class="btns">
      <button class="act" type="button" id="btnCheckB">채점하기</button>
      <button class="act ghost" type="button" id="btnResetB">다시 하기</button>
    </div>
  </section>
</div>

<footer>
  Made by Sangtae Jeong<br>
  ver 260904_1425
</footer>

<script>
/* ===== 시 원문: 연 → 행 → 어절 ===== */
var STANZAS = [
  ["죽는 날까지 하늘을 우러러",
   "한 점 부끄럼이 없기를,",
   "잎새에 이는 바람에도",
   "나는 괴로워했다.",
   "별을 노래하는 마음으로",
   "모든 죽어 가는 것을 사랑해야지",
   "그리고 나한테 주어진 길을",
   "걸어가야겠다."],
  ["오늘 밤에도 별이 바람에 스치운다."]
];

/* 평평한 행 목록 (연 경계 표시 포함) */
var LINES = [];
for (var si = 0; si < STANZAS.length; si++) {
  for (var li = 0; li < STANZAS[si].length; li++) {
    LINES.push({ stanza: si, text: STANZAS[si][li], first: li === 0 });
  }
}

/* 어절 목록 */
var WORDS = [];
for (var i = 0; i < LINES.length; i++) {
  var ws = LINES[i].text.split(" ");
  for (var j = 0; j < ws.length; j++) {
    WORDS.push({ line: i, word: ws[j] });
  }
}

/* ===== 정규화: 문장부호와 공백 무시 ===== */
function norm(s) {
  return String(s).replace(/[.,·!?'"‘’“”「」()]/g, "").replace(/\s+/g, "").trim();
}

/* ===== 시드 난수(mulberry32): 빈칸 순위를 재현 가능하게 ===== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var seed = 20260904;
var rank = [];           // rank[i] = 어절 i 의 빈칸 우선순위(작을수록 먼저 빈칸)
function buildRank() {
  var rnd = mulberry32(seed);
  var order = [];
  for (var i = 0; i < WORDS.length; i++) order.push(i);
  for (var k = order.length - 1; k > 0; k--) {      // 피셔–예이츠 셔플
    var r = Math.floor(rnd() * (k + 1));
    var tmp = order[k]; order[k] = order[r]; order[r] = tmp;
  }
  rank = new Array(WORDS.length);
  for (var p = 0; p < order.length; p++) rank[order[p]] = p;
}
buildRank();

/* ===== 단계 ===== */
var LEVELS = [
  { name: "1단계 · 소리 내어 읽기", ratio: 0.0 },
  { name: "2단계 · 빈칸 30%",      ratio: 0.3 },
  { name: "3단계 · 빈칸 60%",      ratio: 0.6 },
  { name: "4단계 · 빈칸 100%",     ratio: 1.0 }
];
var level = 0;
var cleared = [false, false, false, false];

function blankCount() { return Math.round(WORDS.length * LEVELS[level].ratio); }
function isBlank(i) { return rank[i] < blankCount(); }

/* ===== 단계 버튼 ===== */
var stepsEl = document.getElementById("steps");
function renderSteps() {
  stepsEl.innerHTML = "";
  for (var i = 0; i < LEVELS.length; i++) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "step" + (i === level ? " on" : (cleared[i] ? " done" : ""));
    b.textContent = LEVELS[i].name;
    (function (idx) {
      b.onclick = function () { level = idx; renderSteps(); renderPoemA(); };
    })(i);
    stepsEl.appendChild(b);
  }
}

/* ===== 빈칸 채우기 화면 ===== */
var poemA = document.getElementById("poemA");
function renderPoemA() {
  poemA.innerHTML = "";
  document.getElementById("doneA").style.display = "none";

  var curStanza = null, stanzaEl = null;
  for (var i = 0; i < LINES.length; i++) {
    if (LINES[i].stanza !== curStanza) {
      curStanza = LINES[i].stanza;
      stanzaEl = document.createElement("div");
      stanzaEl.className = "stanza";
      poemA.appendChild(stanzaEl);
    }
    var lineEl = document.createElement("div");
    lineEl.className = "line";
    for (var w = 0; w < WORDS.length; w++) {
      if (WORDS[w].line !== i) continue;
      var text = WORDS[w].word;
      if (isBlank(w)) {
        var inp = document.createElement("input");
        inp.className = "b";
        inp.type = "text";
        inp.setAttribute("data-idx", String(w));
        inp.setAttribute("autocomplete", "off");
        inp.setAttribute("autocapitalize", "off");
        inp.style.width = (norm(text).length * 1.05 + 1.4) + "em";
        inp.oninput = onTypeA;
        inp.onkeydown = onKeyA;
        lineEl.appendChild(inp);
      } else {
        var sp = document.createElement("span");
        sp.className = "w";
        sp.textContent = text;
        lineEl.appendChild(sp);
      }
    }
    stanzaEl.appendChild(lineEl);
  }
  updateStatA();
}

function inputsA() { return poemA.querySelectorAll("input.b"); }

function onTypeA(e) {
  var el = e.target;
  var idx = parseInt(el.getAttribute("data-idx"), 10);
  var v = norm(el.value);
  el.classList.remove("no", "shown");
  if (v.length === 0) { el.classList.remove("ok"); updateStatA(); return; }
  if (v === norm(WORDS[idx].word)) {
    el.classList.add("ok");
    var list = inputsA();
    for (var k = 0; k < list.length; k++) {
      if (list[k] === el && k + 1 < list.length) { list[k + 1].focus(); break; }
    }
  } else {
    el.classList.remove("ok");
  }
  updateStatA();
}

function onKeyA(e) {
  if (e.key !== "Enter") return;
  var list = inputsA();
  for (var k = 0; k < list.length; k++) {
    if (list[k] === e.target && k + 1 < list.length) { list[k + 1].focus(); break; }
  }
}

function updateStatA() {
  var list = inputsA(), ok = 0;
  for (var k = 0; k < list.length; k++) if (list[k].classList.contains("ok")) ok++;
  document.getElementById("okCount").textContent = String(ok);
  document.getElementById("allCount").textContent = String(list.length);
  var pct = list.length === 0 ? 100 : Math.round(ok / list.length * 100);
  document.getElementById("barA").style.width = pct + "%";
  return { ok: ok, total: list.length };
}

document.getElementById("btnCheck").onclick = function () {
  var list = inputsA(), ok = 0, no = 0;
  for (var k = 0; k < list.length; k++) {
    var el = list[k];
    var idx = parseInt(el.getAttribute("data-idx"), 10);
    if (norm(el.value) === norm(WORDS[idx].word) && norm(el.value).length > 0) {
      el.classList.add("ok"); el.classList.remove("no", "shown"); ok++;
    } else {
      el.classList.add("no"); el.classList.remove("ok", "shown"); no++;
    }
  }
  document.getElementById("noCount").textContent = String(no);
  updateStatA();
  var msg = document.getElementById("doneA");
  if (no === 0) {
    cleared[level] = true;
    renderSteps();
    msg.textContent = LEVELS[level].name + " 통과! " +
      (level < LEVELS.length - 1 ? "다음 단계로 넘어가세요." : "시 전체를 외웠습니다. 받아쓰기로 확인해 보세요.");
    msg.style.display = "block";
  } else {
    msg.style.display = "none";
  }
};

document.getElementById("btnReset").onclick = function () {
  document.getElementById("noCount").textContent = "0";
  renderPoemA();
};

document.getElementById("btnPeek").onclick = function () {
  var list = inputsA();
  for (var k = 0; k < list.length; k++) {
    var el = list[k];
    if (el.classList.contains("ok")) continue;
    var idx = parseInt(el.getAttribute("data-idx"), 10);
    el.value = WORDS[idx].word;
    el.classList.add("shown");
    el.classList.remove("no");
  }
  setTimeout(function () {
    var l2 = inputsA();
    for (var k = 0; k < l2.length; k++) {
      if (l2[k].classList.contains("shown")) { l2[k].value = ""; l2[k].classList.remove("shown"); }
    }
  }, 2500);
};

document.getElementById("btnShuffle").onclick = function () {
  seed = (seed + 7919) % 2147483647;
  buildRank();
  document.getElementById("noCount").textContent = "0";
  renderPoemA();
};

/* ===== 받아쓰기 화면 ===== */
var poemB = document.getElementById("poemB");
function renderPoemB() {
  poemB.innerHTML = "";
  document.getElementById("doneB").style.display = "none";
  for (var i = 0; i < LINES.length; i++) {
    if (LINES[i].first && i > 0) {
      var gap = document.createElement("div");
      gap.className = "tgap";
      poemB.appendChild(gap);
    }
    var row = document.createElement("div");
    row.className = "trow";

    var no = document.createElement("div");
    no.className = "tno";
    no.textContent = String(i + 1);
    row.appendChild(no);

    var inp = document.createElement("input");
    inp.className = "tin";
    inp.type = "text";
    inp.setAttribute("data-line", String(i));
    inp.setAttribute("autocomplete", "off");
    inp.onkeydown = onKeyB;
    row.appendChild(inp);

    var hint = document.createElement("button");
    hint.type = "button";
    hint.className = "thint";
    hint.textContent = "힌트";
    (function (li) {
      hint.onclick = function () { showHint(li); };
    })(i);
    row.appendChild(hint);

    poemB.appendChild(row);

    var fb = document.createElement("div");
    fb.className = "fb";
    fb.setAttribute("data-fb", String(i));
    poemB.appendChild(fb);
  }
  document.getElementById("allLine").textContent = String(LINES.length);
  document.getElementById("okLine").textContent = "0";
  document.getElementById("noLine").textContent = "0";
  document.getElementById("barB").style.width = "0%";
}

function showHint(li) {
  var fb = poemB.querySelector('[data-fb="' + li + '"]');
  var ws = LINES[li].text.split(" ");
  var out = "";
  for (var k = 0; k < ws.length; k++) {
    out += '<i class="m">' + ws[k].charAt(0) + "○".repeat(Math.max(0, norm(ws[k]).length - 1)) + "</i>";
  }
  fb.innerHTML = out;
}

function onKeyB(e) {
  if (e.key !== "Enter") return;
  var list = poemB.querySelectorAll("input.tin");
  for (var k = 0; k < list.length; k++) {
    if (list[k] === e.target && k + 1 < list.length) { list[k + 1].focus(); break; }
  }
}

/* 한 줄 채점: 어절 단위 대조 결과를 HTML 로 돌려준다 */
function gradeLine(answer, typed) {
  var a = answer.split(" ");
  var t = String(typed).trim().length ? String(typed).trim().split(/\s+/) : [];
  var n = Math.max(a.length, t.length);
  var ok = true, html = "";
  for (var k = 0; k < n; k++) {
    var av = k < a.length ? a[k] : null;
    var tv = k < t.length ? t[k] : null;
    if (av !== null && tv !== null && norm(av) === norm(tv)) {
      html += '<i class="g">' + av + "</i>";
    } else if (av === null) {
      ok = false;
      html += '<i class="r">' + tv + "</i>";
    } else if (tv === null) {
      ok = false;
      html += '<i class="a">[' + av + "]</i>";
    } else {
      ok = false;
      html += '<i class="r">' + tv + '</i><i class="a">[' + av + "]</i>";
    }
  }
  return { ok: ok, html: html };
}

document.getElementById("btnCheckB").onclick = function () {
  var list = poemB.querySelectorAll("input.tin");
  var ok = 0, no = 0;
  for (var k = 0; k < list.length; k++) {
    var li = parseInt(list[k].getAttribute("data-line"), 10);
    var res = gradeLine(LINES[li].text, list[k].value);
    var fb = poemB.querySelector('[data-fb="' + li + '"]');
    list[k].classList.remove("ok", "no");
    if (res.ok) { list[k].classList.add("ok"); fb.innerHTML = ""; ok++; }
    else { list[k].classList.add("no"); fb.innerHTML = res.html; no++; }
  }
  document.getElementById("okLine").textContent = String(ok);
  document.getElementById("noLine").textContent = String(no);
  document.getElementById("barB").style.width = Math.round(ok / list.length * 100) + "%";
  var msg = document.getElementById("doneB");
  if (no === 0) {
    msg.textContent = "아홉 행을 모두 맞혔습니다. 시 「서시」를 다 외웠어요.";
    msg.style.display = "block";
  } else {
    msg.style.display = "none";
  }
};

document.getElementById("btnResetB").onclick = function () { renderPoemB(); };

/* ===== 탭 ===== */
document.getElementById("tabA").onclick = function () {
  document.getElementById("tabA").classList.add("on");
  document.getElementById("tabB").classList.remove("on");
  document.getElementById("modeA").classList.remove("hide");
  document.getElementById("modeB").classList.add("hide");
};
document.getElementById("tabB").onclick = function () {
  document.getElementById("tabB").classList.add("on");
  document.getElementById("tabA").classList.remove("on");
  document.getElementById("modeB").classList.remove("hide");
  document.getElementById("modeA").classList.add("hide");
};

renderSteps();
renderPoemA();
renderPoemB();
</script>
</body>
</html>
